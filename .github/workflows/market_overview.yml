name: Daily Market Overview

on:

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-overview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance requests holidays beautifulsoup4

      - name: Run Market Overview Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python market_overview.py

      - name: Update cache file if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_cache.json
          git diff --staged --quiet || git commit -m "Update market cache"
          git push
