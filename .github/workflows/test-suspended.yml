name: Test Suspended Stocks

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas

      - name: Verify yfinance
        run: |
          python -c "import yfinance; print('yfinance installed:', yfinance.__version__)"

      - name: Run test
        run: python test_suspended.py
