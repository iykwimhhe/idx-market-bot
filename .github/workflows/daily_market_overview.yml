name: Daily Morning Market Overview

on:
  schedule:
    # 06:00 WIB (UTC+7) Mon-Fri = 23:00 UTC Sun-Thu
    - cron: '0 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-market-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance feedparser holidays requests beautifulsoup4 lxml

      - name: Run morning market overview and push to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python market_overview.py

      - name: Persist updated ICI coal cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [[ -n $(git status --porcelain ici_coal_cache.json) ]]; then
            git add ici_coal_cache.json
            git commit -m "chore: update weekly ICI coal cache [skip ci]"
            git push
          else
            echo "No changes to ici_coal_cache.json"
          fi
